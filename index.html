<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Krem Chympe — Chympe Cave &amp; Waterfall, East Jaintia Hills</title>
<meta name="description" content="Krem Chympe: one of India's five longest caves and the waterfall that shares its name, deep in Meghalaya's rainforest in Khaddum village, East Jaintia Hills." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Matches the font pairing used on the Packages/Tour booking pages, so the two feel like one site -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ================================================================
     Nothing below this line needs editing to change WORDS or PHOTOS.
     Open content.js instead — every field here is filled in by it.
     ================================================================ -->

<nav class="site-nav" id="siteNav">
  <a class="brand" href="#top">
    <img class="js-logo" src="images/logo.png" alt="Krem Chympe logo" />
    <span class="brand-text js-brand-name">Krem Chympe</span>
  </a>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-ctas">
    <a class="nav-cta js-wa-link" href="#" target="_blank" rel="noopener" id="navButtonLabel">Enquire</a>
    <a class="nav-cta nav-cta-book" href="book/index.html">Book</a>
  </div>
  <button class="nav-menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <div id="mobileMenuLinks" style="display:flex;flex-direction:column;align-items:center;gap:28px"></div>
  <a class="js-wa-link" href="#" target="_blank" rel="noopener" style="color:#25D366;font-family:var(--display);font-size:28px;text-decoration:none;margin-top:8px">WhatsApp Us</a>
  <a href="book/index.html" style="color:var(--gold);font-family:var(--display);font-size:28px;text-decoration:none;margin-top:8px">Book a Tour</a>
</div>

<!-- ============ HERO ============ -->
<header class="hero" id="top">
  <div class="hero-content">
    <div class="eyebrow" id="heroEyebrow"></div>
    <h1 id="heroHeadline"></h1>
    <p class="hero-sub" id="heroSub"></p>
  </div>
  <div class="hero-scroll"><span id="heroScrollLabel">Scroll</span> ↓</div>
</header>


<!-- ============ THE PLACE ============ -->
<section class="section place" id="place">
  <div class="wrap">
    <div class="place-grid">
      <div class="place-copy reveal">
        <div class="eyebrow" id="placeEyebrow"></div>
        <h2 id="placeHeading"></h2>
        <div id="placeParagraphs"></div>
        <dl class="field-notes" id="placeFacts"></dl>
      </div>
    </div>
  </div>
</section>


<!-- ============ FOUNDER ============ -->
<section class="section founder" id="founder">
  <div class="wrap">
    <div class="founder-grid">
      <div class="founder-mark reveal" id="founderMarkWrap"></div>
      <div class="founder-copy reveal">
        <div class="eyebrow" id="founderEyebrow"></div>
        <p class="founder-quote" id="founderQuote"></p>
        <div class="collapse-panel" id="founderDetails">
          <div id="founderParagraphs"></div>
          <div class="founder-name" id="founderName"></div>
        </div>
      </div>
    </div>
  </div>
</section>


<!-- ============ ACTIVITIES ============ -->
<section class="section activities" id="activities">
  <div class="wrap">
    <div class="section-head reveal">
      <div class="eyebrow" id="activitiesEyebrow"></div>
      <h2 id="activitiesHeading"></h2>
      <p id="activitiesIntro"></p>
    </div>
    <div class="collapse-panel" id="activitiesDetails">
      <div class="activity-grid" id="activityGrid"></div>
      <div class="also-here reveal" id="alsoHereChips"></div>
    </div>
  </div>
</section>


<!-- ============ GALLERY ============ -->
<section class="section gallery" id="gallery">
  <div class="wrap">
    <div class="section-head reveal">
      <div class="eyebrow" id="galleryEyebrow"></div>
      <h2 id="galleryHeading"></h2>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="gallery-explore reveal">
      <a class="btn-ig" href="#" target="_blank" rel="noopener" id="galleryIgLink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span>Explore on Instagram</span>
      </a>
    </div>
  </div>
</section>


<!-- ============ SAFETY & SEASON ============ -->
<section class="section safety" id="safety">
  <div class="wrap">
    <div class="safety-grid">
      <div class="reveal">
        <div class="eyebrow" id="safetyEyebrow"></div>
        <h2 style="margin-top:16px;font-size:clamp(24px,3vw,32px)" id="safetyHeading"></h2>
        <div class="collapse-panel" id="safetyListWrap">
          <ul class="safety-list" id="safetyList" style="margin-top:28px"></ul>
        </div>
      </div>
      <div class="season-copy reveal">
        <div class="eyebrow" id="seasonEyebrow"></div>
        <h2 style="margin-top:16px;font-size:clamp(24px,3vw,32px)" id="seasonHeading"></h2>
        <div class="collapse-panel" id="seasonDetailsWrap">
          <div id="seasonParagraphs" style="margin-top:22px"></div>
          <div class="season-tag" id="seasonTag"></div>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">
  <div class="wrap">
    <div class="eyebrow" id="contactEyebrow" style="justify-content:center"></div>
    <h2 class="reveal" id="contactHeading"></h2>
    <div class="collapse-panel" id="contactDetails">
      <p class="reveal" id="contactParagraph"></p>
      <div class="contact-actions reveal">
        <a class="btn-whatsapp js-wa-link" href="#" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A8.86 8.86 0 0 0 12.05 4a8.94 8.94 0 0 0-7.75 13.4L3 21l3.7-1.28a8.92 8.92 0 0 0 5.35 1.8h.01a8.95 8.95 0 0 0 8.94-8.85 8.87 8.87 0 0 0-3.4-6.35Zm-5.55 13.7h-.01a7.4 7.4 0 0 1-3.8-1.04l-.27-.16-2.2.76.72-2.13-.17-.28a7.43 7.43 0 1 1 13.8-3.85 7.44 7.44 0 0 1-7.07 6.7Zm4.08-5.56c-.22-.11-1.32-.65-1.53-.73-.2-.08-.35-.11-.5.11-.15.22-.58.73-.71.88-.13.15-.26.16-.48.05-.22-.11-.94-.35-1.8-1.11-.66-.6-1.11-1.33-1.24-1.55-.13-.22-.01-.34.1-.45.1-.1.22-.26.33-.4.11-.13.15-.22.22-.37.07-.15.04-.28-.02-.4-.06-.11-.5-1.2-.68-1.65-.18-.43-.36-.37-.5-.38h-.43c-.15 0-.4.05-.6.28-.2.22-.8.78-.8 1.9s.82 2.2.93 2.35c.11.15 1.6 2.44 3.87 3.42.54.23.96.37 1.29.48.54.17 1.03.15 1.42.09.43-.06 1.32-.54 1.51-1.06.19-.52.19-.96.13-1.06-.06-.09-.2-.15-.42-.26Z"/></svg>
          <span id="contactWaLabel">Message us on WhatsApp</span>
        </a>
        <a class="btn-ig" href="#" target="_blank" rel="noopener" id="igLink">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none"/></svg>
          <span id="igHandle">Instagram</span>
        </a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-grid">
    <a class="footer-brand" href="#top">
      <img class="js-logo" src="images/logo.png" alt="Krem Chympe" />
      <span class="js-brand-name">Krem Chympe</span>
    </a>
    <div class="footer-links" id="footerLinksMirror">
      <a href="#place">The Place</a>
      <a href="#founder">Founder</a>
      <a href="#activities">Activities</a>
      <a href="#gallery">Gallery</a>
    </div>
    <div id="footerAddress"></div>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImg" src="" alt="" />
</div>

<noscript>
  <div style="padding:40px;text-align:center;font-family:sans-serif">
    This site needs JavaScript enabled to display its content. Please enable JavaScript in your browser.
  </div>
</noscript>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
